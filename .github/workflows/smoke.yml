# Smoke test of one momentry release on every shipped target (Linux and macOS on amd64 and arm64, Windows amd64), on
# the assets exactly as they were uploaded to the (draft) release.
# Started only by hand or by the maintainer's publish script (`gh workflow run smoke.yml -f tag=<tag>`), never by a
# push or a pull request; a draft release is published only after this run is green.
# Checks per target (.github/smoke/smoke.sh, smoke.ps1): checksums.txt, install through install.sh / install.ps1,
# --version, doctor --json, the installed tree against BUILD.files, reinstall changes nothing, a tampered archive
# is refused, the hook's background harvest survives the death of its parent's process group or Job Object, update
# from the previous published release, uninstall.
#
# The draft's assets reach the test jobs as a workflow artifact. Artifacts of a public repo can be downloaded by any
# signed-in GitHub user, so the artifact lives one day at most and the last job deletes it whatever the outcome:
# a draft is fetchable this way only while a smoke run is in progress.
name: smoke
run-name: smoke ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (a draft or a published release), e.g. v1.2.3
        required: true
        type: string

permissions: {}

concurrency:
  group: smoke-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Draft releases are listed only to tokens with push access, so this job alone gets contents: write. It runs
  # nothing from the assets: it downloads them and hands them to the test jobs, which only read.
  assets:
    name: download the release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: download ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in *[!0-9A-Za-z.v-]*|'') echo "::error::not a release tag"; exit 1 ;; esac
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' || { echo "::error::not a release tag: $TAG"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          # the digests this run tests; the publish script checks the draft still has exactly these before publishing
          (cd assets && sha256sum -- *) | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets
          path: assets/
          if-no-files-found: error
          retention-days: 1

  smoke:
    needs: assets
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # linux-amd64, linux-arm64, darwin-arm64, darwin-amd64, windows-amd64: every archive of a release
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
          path: ${{ runner.temp }}/assets
      # The only step that sees a token: it finds the latest published release and downloads its installers for the
      # update check. No binary under test runs while the token is in the environment.
      - name: previous published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev_dir="$RUNNER_TEMP/prev"; mkdir -p "$prev_dir"
          if prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>"$RUNNER_TEMP/gh.err"); then
            if [ "$prev" != "$TAG" ]; then
              gh release download "$prev" --repo "$GITHUB_REPOSITORY" --pattern install.sh --pattern install.ps1 --dir "$prev_dir"
              printf '%s\n' "$prev" > "$prev_dir/TAG"
            fi
          elif grep -q 'release not found' "$RUNNER_TEMP/gh.err"; then
            echo "no published release yet"
          else
            cat "$RUNNER_TEMP/gh.err" >&2
            echo "::error::cannot read the latest published release"; exit 1
          fi
      - name: smoke (sh)
        if: runner.os != 'Windows'
        run: sh .github/smoke/smoke.sh "$TAG" "$RUNNER_TEMP/assets" "$RUNNER_TEMP/prev"
      - name: smoke (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .github/smoke/smoke.ps1 -Tag $env:TAG -Assets (Join-Path $env:RUNNER_TEMP 'assets') -Previous (Join-Path $env:RUNNER_TEMP 'prev')
          exit $LASTEXITCODE

  # Deletes this run's artifacts (the draft's assets) whether the smoke passed, failed or was cancelled.
  cleanup:
    needs: [assets, smoke]
    if: always()
    name: delete the assets artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: delete the artifacts of run ${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id')
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "deleted artifact $id"
          done
          left=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.total_count')
          [ "$left" = 0 ] || { echo "::error::$left artifact(s) still attached to this run"; exit 1; }
